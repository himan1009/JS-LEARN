<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: #212121; color: white;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    // 1st way to append list element in above body and all
    // more tree traversing so time consuming

    function addLanguage(langName){
        const li=document.createElement('li');
        li.innerHTML=`${langName}`;
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("python")
    addLanguage("C++")

    // 2nd way to appending child
    // good optimisation
    function addOptiLanguage(langName){
        const li=document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li);
    }
    addOptiLanguage("ruby")
    addOptiLanguage("GoLang")


    // good way to change python to mojo
    const secondLang=document.querySelector("li:nth-child(2)")
    const newLi=document.createElement('li')
    newLi.textContent="Mojo";
    secondLang.replaceWith(newLi)

    // again a another way to replace javascript to typescript
    const firstLang=document.querySelector("li:first-child");
    firstLang.outerHTML='<li>TypeScript</li>'

    // remove last element golang
    const lastLang=document.querySelector("li:last-child")
    lastLang.remove()
</script>
</html>
